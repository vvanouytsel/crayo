name: Release

on:
  push:
    branches: [main]
  # Run by hand to (re)build the app for a release that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the app to, for example v1.2.0"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Reads the commit messages and keeps a "release" pull request up to date.
  # Merging that pull request creates the tag and the GitHub release.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the signed app and attaches it to the release as crayo.apk.
  # Needs two repository secrets:
  #   CRAYO_KEYSTORE_BASE64    the signing key file (crayo-release.jks) as base64 text
  #   CRAYO_KEYSTORE_PASSWORD  the password of that key file
  apk:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      KEYSTORE_BASE64: ${{ secrets.CRAYO_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.CRAYO_KEYSTORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check that the signing key is set
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The secrets CRAYO_KEYSTORE_BASE64 and CRAYO_KEYSTORE_PASSWORD must both be set to build the app for $TAG."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the Android parts the build needs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Build the signed app
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/crayo-release.jks"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PcrayoKeystore="$RUNNER_TEMP/crayo-release.jks" \
            -PcrayoKeystorePassword="$KEYSTORE_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk crayo.apk

      - name: Check the app is signed
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs crayo.apk | head -n 2

      - name: Attach the app to the release
        run: gh release upload "$TAG" crayo.apk --clobber --repo "$GITHUB_REPOSITORY"

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/crayo-release.jks"
