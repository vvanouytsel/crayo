name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Reads the commit messages and keeps a "release" pull request up to date.
  # Merging that pull request creates the tag and the GitHub release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the signed app and attaches it to the release.
  # Needs two repository secrets: CRAYO_KEYSTORE_BASE64 and CRAYO_KEYSTORE_PASSWORD.
  # Without them this job only prints a note, and the app file is added by hand.
  apk:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.CRAYO_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.CRAYO_KEYSTORE_PASSWORD }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for the signing key
        id: key
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing key secrets set, so no app file was built for $TAG."
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Build the signed app
        if: steps.key.outputs.present == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/crayo-release.jks"
          ./gradlew assembleRelease \
            -PcrayoKeystore="$RUNNER_TEMP/crayo-release.jks" \
            -PcrayoKeystorePassword="$KEYSTORE_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk crayo.apk
      - name: Attach the app to the release
        if: steps.key.outputs.present == 'true'
        run: gh release upload "$TAG" crayo.apk --clobber --repo "$GITHUB_REPOSITORY"
