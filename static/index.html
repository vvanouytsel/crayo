<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crayo</title>
<style>
  :root { --ink:#222; --muted:#6b6b6b; --line:#e3e0d8; --paper:#fffdf8; --accent:#e8523f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; color:var(--ink); background:var(--paper); }
  header { text-align:center; padding:28px 16px 8px; }
  .logo { font-size:44px; font-weight:800; letter-spacing:1px; margin:0; }
  .logo span:nth-child(1){color:#e8523f} .logo span:nth-child(2){color:#f2a23a} .logo span:nth-child(3){color:#e7c52b}
  .logo span:nth-child(4){color:#4fae5a} .logo span:nth-child(5){color:#3a8fd9}
  .tag { color:var(--muted); margin:2px 0 18px; }
  form { display:flex; gap:8px; max-width:560px; margin:0 auto; }
  input[type=search] { flex:1; font-size:18px; padding:12px 14px; border:2px solid var(--line); border-radius:12px; outline:none; background:#fff; }
  input[type=search]:focus { border-color:var(--accent); }
  button { font:inherit; cursor:pointer; }
  .go { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:0 22px; font-weight:600; font-size:16px; }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:14px auto 0; max-width:700px; }
  .chip { background:#fff; border:1px solid var(--line); border-radius:99px; padding:6px 14px; font-size:14px; }
  .chip:hover { border-color:var(--accent); }
  main { max-width:1100px; margin:0 auto; padding:8px 16px 110px; }
  .status { text-align:center; color:var(--muted); min-height:24px; margin:16px 0; }
  .status button { background:none; border:0; color:var(--accent); text-decoration:underline; font-size:inherit; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:14px; }
  .card { position:relative; background:#fff; border:2px solid var(--line); border-radius:12px; padding:8px; cursor:pointer; }
  .card:hover { border-color:#c9c4b6; }
  .card.on { border-color:var(--accent); box-shadow:0 0 0 3px #e8523f33; }
  .card.weak { opacity:.55; }
  .card .pic { height:210px; display:flex; align-items:center; justify-content:center; }
  .card img { max-width:100%; max-height:100%; }
  .card .name { font-size:13px; margin:6px 2px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .src { font-size:11px; color:var(--muted); margin:0 2px; }
  .tick { position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; display:none; align-items:center; justify-content:center; font-weight:700; }
  .card.on .tick { display:flex; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:12px 16px; display:none; justify-content:center; align-items:center; gap:14px; }
  .bar.show { display:flex; }
  .bar .print { background:var(--ink); color:#fff; border:0; border-radius:12px; padding:12px 26px; font-weight:600; font-size:16px; }
  .bar .clear { background:none; border:0; color:var(--muted); text-decoration:underline; }
  #sheet { display:none; }

  @page { size:A4; margin:0; }
  @media print {
    body { background:#fff; }
    header, main, .bar { display:none !important; }
    #sheet { display:block; }
    .page { width:210mm; height:297mm; position:relative; overflow:hidden; page-break-after:always; break-after:page; }
    .page:last-child { page-break-after:auto; break-after:auto; }
    .page img { position:absolute; top:50%; left:50%; width:194mm; height:281mm; object-fit:contain; transform:translate(-50%,-50%); }
    .page.wide img { width:281mm; height:194mm; transform:translate(-50%,-50%) rotate(90deg); }
  }
</style>
</head>
<body>
<header>
  <h1 class="logo"><span>C</span><span>r</span><span>a</span><span>y</span><span>o</span></h1>
  <p class="tag">Find a coloring page and print it</p>
  <form id="form">
    <input type="search" id="q" placeholder="dragon, draak, unicorn, brandweerauto…" autocomplete="off" autofocus>
    <button class="go" type="submit">Search</button>
  </form>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>
</main>
<div class="bar" id="bar">
  <span id="count"></span>
  <button class="print" id="print">Print</button>
  <button class="clear" id="clear">Clear</button>
</div>
<div id="sheet"></div>

<script>
const $ = id => document.getElementById(id);
const selected = new Set();
let results = [], showWeak = false;

["dragon","unicorn","dinosaur","princess","car","fire truck","cat","dog","horse","butterfly","robot","space"].forEach(w => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = w;
  b.onclick = () => { $("q").value = w; search(); };
  $("chips").appendChild(b);
});

$("form").onsubmit = e => { e.preventDefault(); search(); };

let current = null, searching = false, terms = "";

async function search() {
  const q = $("q").value.trim();
  if (!q) return;
  if (current) current.abort();
  current = new AbortController();
  selected.clear(); updateBar();
  results = []; showWeak = false; terms = ""; searching = true;
  $("grid").innerHTML = "";
  status();
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q), { signal: current.signal });
    const reader = r.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n"); buffer = lines.pop();
      let added = false;
      for (const line of lines) {
        if (!line.trim()) continue;
        const msg = JSON.parse(line);
        if (msg.type === "terms") terms = [...new Set(msg.terms)].join(" / ");
        else if (msg.type === "item") { results.push(msg); if (msg.looks_ok || showWeak) $("grid").appendChild(card(msg)); added = true; }
        else if (msg.type === "done") searching = false;
      }
      status();
    }
  } catch (e) {
    if (e.name === "AbortError") return;
    $("status").textContent = "Something went wrong. Is Crayo still running?";
  }
  searching = false; status();
}

function status() {
  const good = results.filter(r => r.looks_ok).length, weak = results.length - good;
  const st = $("status");
  if (!searching && results.length === 0) { st.textContent = `No coloring pages found for "${terms}". Try another word.`; return; }
  st.textContent = searching ? `Searching… ${good} found so far. ` : `${good} coloring pages for "${terms}". `;
  if (weak && !searching) {
    const b = document.createElement("button");
    b.textContent = showWeak ? "Hide the rest" : `Show ${weak} more that may not print well`;
    b.onclick = () => { showWeak = !showWeak; render(); };
    st.appendChild(b);
  }
}

function render() {
  $("grid").innerHTML = "";
  results.filter(r => showWeak || r.looks_ok).forEach(r => $("grid").appendChild(card(r)));
  status();
}

function card(r) {
  const el = document.createElement("div");
  el.className = "card" + (r.looks_ok ? "" : " weak") + (selected.has(r.id) ? " on" : "");
  const pic = document.createElement("div"); pic.className = "pic";
  const img = document.createElement("img"); img.src = "/img/" + r.id; img.alt = r.title; img.loading = "lazy";
  pic.appendChild(img);
  const name = document.createElement("div"); name.className = "name"; name.textContent = r.title;
  const src = document.createElement("div"); src.className = "src"; src.textContent = r.source;
  const tick = document.createElement("div"); tick.className = "tick"; tick.textContent = "✓";
  el.append(tick, pic, name, src);
  el.onclick = () => {
    selected.has(r.id) ? selected.delete(r.id) : selected.add(r.id);
    el.classList.toggle("on"); updateBar();
  };
  return el;
}

function updateBar() {
  const n = selected.size;
  $("bar").classList.toggle("show", n > 0);
  $("count").textContent = n === 1 ? "1 page selected" : `${n} pages selected`;
  $("print").textContent = n === 1 ? "Print page" : `Print ${n} pages`;
}
$("clear").onclick = () => { selected.clear(); updateBar(); render(); };

$("print").onclick = async () => {
  const sheet = $("sheet"); sheet.innerHTML = "";
  $("print").textContent = "Getting full size…";
  const pages = await Promise.all([...selected].map(id => new Promise(done => {
    const img = new Image();
    img.onload = () => done({ img, wide: img.naturalWidth > img.naturalHeight * 1.15 });
    img.onerror = () => done(null);
    img.src = "/full/" + id;
  })));
  pages.filter(Boolean).forEach(p => {
    const page = document.createElement("div");
    page.className = "page" + (p.wide ? " wide" : "");
    page.appendChild(p.img); sheet.appendChild(page);
  });
  updateBar();
  window.print();
};
</script>
</body>
</html>
